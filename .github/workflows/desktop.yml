name: Applications de bureau

on:
  workflow_dispatch:

jobs:
  package:
    strategy:
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            artifact: souris-windows
            files: release/*.exe
          - os: ubuntu-latest
            script: dist:linux
            artifact: souris-linux
            files: release/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libopenjp2-tools
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
